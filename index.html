<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>Live canvas</title>
<style>
  :root {
    --dire-wolf: #272727;
    --jet: #353535;
    --black-panther: #424242;
    --magical-moonlight: #f0eeeb;
    --ghosted: #e3e0dc;
    --accent: #e61717;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--dire-wolf);
    color: var(--magical-moonlight);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    overflow: hidden;
  }

  #viewer {
    position: absolute;
    inset: 0;
    background: var(--dire-wolf);
  }

  /* Header strip — quiet, sits over the canvas */
  header {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 5;
    display: flex;
    align-items: baseline;
    gap: 0.9rem;
    padding: 0.85rem 1.2rem;
    pointer-events: none;
  }
  header .title {
    font-size: 1.05rem;
    letter-spacing: 0.02em;
    color: var(--magical-moonlight);
    mix-blend-mode: difference;
    color: #fff;
  }
  .hint {
    position: fixed;
    bottom: 1rem;
    left: 19.5rem;
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    color: var(--ghosted);
  }
  header .live {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 0.45rem;
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    color: var(--ghosted);
    text-transform: lowercase;
    mix-blend-mode: difference;
    color: #fff;
  }
  header .live::before {
    content: "";
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 rgba(200,0,0,0.6);
    animation: pulse 2.4s ease-out infinite;
    isolation: isolate;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(200,0,0,0.55); }
    70%  { box-shadow: 0 0 0 7px rgba(200,0,0,0); }
    100% { box-shadow: 0 0 0 0 rgba(200,0,0,0); }
  }
  @media (prefers-reduced-motion: reduce) {
    header .live::before { animation: none; }
  }

  /* Loading / offline state */
  #state {
    position: absolute;
    inset: 0;
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    background: var(--dire-wolf);
    text-align: center;
    padding: 2rem;
    transition: opacity 0.4s ease;
  }
  #state.hidden { opacity: 0; pointer-events: none; }
  #state .mark {
    font-size: 2rem;
    color: var(--black-panther);
    letter-spacing: 0.3em;
  }
  #state .msg { color: var(--ghosted); font-size: 0.95rem; }

  /* Footer note */
  footer {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    z-index: 5;
    padding: 0.6rem 1.2rem;
    font-size: 0.85rem;
    color: var(--ghosted);
    pointer-events: none;
    text-align: right;
    mix-blend-mode: difference;
    color: #fff;
  }

  /* OSD control buttons live bottom-left by default; keep them subtle */
  .openseadragon-container { background: var(--dire-wolf) !important; }

  /* Navigator (corner overview) — force 16:9 and give it a quiet frame */
  .navigator {
    width: 288px !important;
    height: 162px !important;
    border: 1px solid var(--black-panther) !important;
    background: var(--jet) !important;
    margin: 0 0.9rem 1rem 1rem !important;
    border-radius: 2px;
  }
  .navigator .displayregion {
    border: 1px solid var(--accent) !important;
  }
</style>
</head>
<body>
  <header>
    <!-- EDIT THE TITLE HERE -->
    <span class="title">LiveCanvas</span>
    <span class="live">live</span>
  </header>
  <span class="hint" aria-label="drag to move, scroll to zoom">
      <!-- drag icon -->
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18"/><path d="M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg>
      <!-- zoom icon -->
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M8 10.5h5M10.5 8v5"/></svg>
    </span>

  <div id="viewer"></div>

  <div id="state">
    <div class="mark">· · ·</div>
    <div class="msg">Loading the canvas…</div>
  </div>

  <!-- EDIT THE FOOTER TEXT HERE -->
  <footer>Work in progress — please don't repost without permission and credit.</footer>

  <script src="https://cdn.jsdelivr.net/npm/openseadragon@6.1.0/build/openseadragon/openseadragon.min.js"></script>
  <script>
    // ---- config ----
    const IMAGE = "canvas.png";     // the file you overwrite when you update
    const REFRESH_MS = 20000;       // how often to check for a new version (20s)
    // -----------------

    const stateEl = document.getElementById("state");
    const stateMsg = stateEl.querySelector(".msg");

    let viewer = OpenSeadragon({
      id: "viewer",
      prefixUrl: "https://cdn.jsdelivr.net/npm/openseadragon@6.1.0/build/openseadragon/images/",
      tileSources: { type: "image", url: cacheBusted(IMAGE) },
      showNavigationControl: false,
      showNavigator: true,
      navigatorPosition: "BOTTOM_LEFT",
      navigatorAutoFade: true,
      gestureSettingsMouse: { clickToZoom: false },
      // --- keep the image flush, no floating past its edges ---
      minZoomImageRatio: 1,      // can't zoom out smaller than fit
      maxZoomPixelRatio: 4,
      visibilityRatio: 1,        // edges always stay against the frame
      homeFillsViewer: true,    // fit whole canvas (letterbox), don't crop
      constrainDuringPan: true,  // lock while dragging, not just after
      animationTime: 0.6,
      springStiffness: 7,
      immediateRender: true,
      preserveViewport: true    // keep the user's pan/zoom across refreshes
    });

    viewer.addHandler("open", () => stateEl.classList.add("hidden"));
    viewer.addHandler("open", () => {
      viewer.viewport.fitHorizontally(true);
      const vb = viewer.viewport.getBounds();
      viewer.viewport.panTo(
        new OpenSeadragon.Point(0.5, vb.height / 2),
        true
      );
    });
    viewer.addHandler("open-failed", showOffline);

    function cacheBusted(url) {
      return url + "?v=" + Date.now();
    }

    function showOffline() {
      stateEl.classList.remove("hidden");
      stateEl.querySelector(".mark").textContent = "—";
      stateMsg.textContent = "The canvas is offline right now. Check back during a stream.";
    }

    // Poll for an updated image. Only swap if the file actually changed,
    // so the viewer isn't reset while nothing is new.
    let lastTag = null;
    async function checkForUpdate() {
      try {
        const res = await fetch(cacheBusted(IMAGE), { method: "HEAD" });
        if (!res.ok) return;
        const tag = res.headers.get("etag") || res.headers.get("last-modified");
        if (tag && tag !== lastTag) {
          if (lastTag !== null) swapImage();  // don't reswap on first load
          lastTag = tag;
        }
      } catch (e) { /* offline; ignore */ }
    }

    function swapImage() {
      // Remember where the viewer is looking, reopen, restore it.
      const vp = viewer.viewport;
      const center = vp.getCenter();
      const zoom = vp.getZoom();
      viewer.addOnceHandler("open", () => {
        viewer.viewport.zoomTo(zoom, null, true);
        viewer.viewport.panTo(center, true);
      });
      viewer.open({ type: "image", url: cacheBusted(IMAGE) });
    }

    setInterval(checkForUpdate, REFRESH_MS);
  </script>
</body>
</html>
